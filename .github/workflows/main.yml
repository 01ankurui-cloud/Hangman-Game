name: CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/build-action@v1
        with:
          filename: buildozer.spec
          preset: android
          android_architectures: arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hangman-APK
          path: bin/*.apk
